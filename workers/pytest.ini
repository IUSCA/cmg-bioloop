[pytest]
# Pytest configuration for upload verification tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings

# Markers (defined in conftest.py but listed here for reference)
markers =
    integration: Integration tests (run against Docker services)
    slow: Slow tests (may take minutes)
    requires_celery: Tests that require Celery worker running

# Logging
log_cli = false
log_cli_level = INFO
log_file_level = DEBUG

# Test timeout: 10 minutes max per test (for slow tests)
timeout = 600
