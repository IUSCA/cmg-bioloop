version: '3.8'

services:
  db_sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bioloop_db_sandbox
    env_file:
      - .env.default
      - .env
    volumes:
      - .:/opt/sca/app
      - ../api/prisma:/opt/sca/api/prisma:ro
      - ../api/.env:/opt/sca/api/.env:ro
      - ../api/admins.json:/opt/sca/api/admins.json:ro
      - ../api/operators.json:/opt/sca/api/operators.json:ro
      - ../api/users.json:/opt/sca/api/users.json:ro
      - db_sandbox_pgdata:/var/lib/postgresql/15/main
      - db_sandbox_node_modules:/opt/sca/app/node_modules
      # Shared mount for CMG<->Bioloop sync testing coordination
      # Contains: test queue/results, agent status, coordination logs, and all testing documentation
      # Both CMG and Bioloop agents can read/write to this directory in real-time
      - /tmp/cmg-bioloop:/tmp/cmg-bioloop
    working_dir: /opt/sca/app
    ports:
      - "127.0.0.1:5435:5432"
    networks:
      - sandbox_network
      - bioloop_default
      - cmg_cmg-network
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    command: ["tail", "-f", "/dev/null"]

networks:
  sandbox_network:
    name: bioloop_sandbox
    driver: bridge
  bioloop_default:
    external: true
    name: bioloop_default
  cmg_cmg-network:
    external: true
    name: cmg_cmg-network

volumes:
  db_sandbox_pgdata:
    name: bioloop_sandbox_pgdata
  db_sandbox_node_modules:
    name: bioloop_sandbox_node_modules
